<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="Shortcut Icon" href="./Images/JavaScript.webp" />
    <title>Input</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="gallery">
      <div class="protrait-gallery">
        <div class="gallery-cnt">
          <img src="./Images/Image 01.jpg" alt="" />
        </div>
        <div class="gallery-cnt">
          <img src="./Images/Image 02.jpg" alt="" />
        </div>
        <div class="gallery-cnt">
          <img src="./Images/Image 03.jpg" alt="" />
        </div>
        <div class="gallery-cnt">
          <img src="./Images/Image 04.jpg" alt="" />
        </div>
        <div class="gallery-cnt">
          <img src="./Images/Image 05.jpg" alt="" />
        </div>
        <div class="gallery-cnt">
          <img src="./Images/Image 06.jpg" alt="" />
        </div>
        <div class="gallery-cnt">
          <img src="./Images/Image 07.jpg" alt="" />
        </div>
        <div class="gallery-cnt">
          <img src="./Images/Image 01.jpg" alt="" />
        </div>
      </div>
    </div>
    <div class="popup">
      <div class="popup-img">
        <img src="./Images/Image 06.jpg" alt="" />
      </div>
      <button class="right">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
      <button class="left">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
    </div>

    <div class="prdct-menu">
      <form class="prdct-counter">
        <button class="decrement counter-btn">
          <i class="fa-solid fa-minus"></i>
        </button>
        <input class="counter" type="number" min="1" value="1" />
        <button class="increment counter-btn">
          <i class="fa-solid fa-plus"></i>
        </button>
      </form>
      <form id="acc-info" class="acc-info">
        <div class="pass-input">
          <label for="user-password">Password</label>
          <input
            id="user-password"
            class="user-password"
            type="password"
            placeholder=""
            spellcheck="false"
          />
          <a id="eyeIcon" class="eyeIcon">
            <i class="fa-regular fa-eye-slash"></i>
          </a>
        </div>
        <button type="submit" id="Sumbit" class="submit-btn">Submit</button>
        <div class="valid-pass no-select">
          <span class="valid-pass-rule"
            >At least one uppercase letter (A-Z)</span
          >
          <span class="valid-pass-rule"
            >At least one lowercase letter (a-z)</span
          >
          <span class="valid-pass-rule">At least one number (0-9)</span>
          <span class="valid-pass-rule"
            >At least one symbol (e.g., ! @ # $ % ^ & *)</span
          >
          <span class="valid-pass-rule">Minimum 8-12 Characters</span>
        </div>
      </form>
    </div>

    <!-- <div class="coursor"></div> -->

    <script src="./app.js?v=1.3"></script>
  </body>
</html>
